[package]
name = "abacus-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.abacus]
path = ".."

[[bin]]
name = "fuzz_eval"
path = "fuzz_targets/fuzz_eval.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_eval_config"
path = "fuzz_targets/fuzz_eval_config.rs"
test = false
doc = false
bench = false
