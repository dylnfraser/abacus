[package]
name = "abacus"
version = "0.1.0"
edition = "2024"
authors = ["Dylan Fraser"]
description = "A fast, unit-aware mathematical evaluation engine and interval calculator with no required crate dependencies"
license = "MIT"
repository = "https://github.com/dylnfraser/abacus"
homepage = "https://github.com/dylnfraser/abacus"
readme = "README.md"
keywords = ["calculator", "units", "dimensions", "interval-arithmetic", "math"]
categories = ["science", "mathematics", "parser-implementations"]

# Note: profiles only affect binaries built from this repository (the `abacus` CLI, the REPL,
# benches); crates depending on abacus use their own profile settings.
[profile.release]
opt-level = 3
strip = "symbols"
debug = 0
lto = "thin"
codegen-units = 1
# Unwind (the default) so a panic in an evaluation can be caught instead of aborting.
incremental = false
overflow-checks = true

# Size-optimised build: `cargo build --profile release-small`.
[profile.release-small]
inherits = "release"
opt-level = "z"

[profile.dev]
opt-level = 0
incremental = true
codegen-units = 256
lto = false

[dependencies]
rustyline = { version = "15.0", optional = true }
serde = { version = "1.0", default-features = false, features = ["derive", "std", "rc"], optional = true }

[features]
default = ["units", "stats", "distributions", "date", "financial", "number-scales", "currencies", "live-rates"]
units = []
stats = []
distributions = []
date = []
financial = []
number-scales = []
currencies = []
# Enables `Abacus::with_live_rates`/`update_daily_rates`/`fetch_live_rates`, which run the
# system `curl` binary against api.frankfurter.dev. Nothing touches the network unless one of
# those methods is called explicitly.
live-rates = ["currencies"]
serde = ["dep:serde"]
repl = ["dep:rustyline"]

[[bin]]
name = "repl"
path = "src/bin/repl.rs"
required-features = ["repl"]

[[bin]]
name = "abacus"
path = "src/main.rs"

[dev-dependencies]
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "eval_bench"
harness = false
